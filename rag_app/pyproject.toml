[project]
name = "rag_app"
version = "0.1.0"
description = "RAG API service built with FastAPI, pgvector, Redis, and MinIO"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "openai>=1.30.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "redis[hiredis]>=5.0.0",
    "minio>=7.2.0",
    "aiohttp>=3.13.2",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["rag_app"]
package-dir = { rag_app = "." }
