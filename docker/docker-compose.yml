version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: 123
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - rag_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rag_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rag_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag_app:
    build:
      context: ..
      dockerfile: docker/rag.Dockerfile
    container_name: rag_api
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${RAG_API_PORT:-8000}:8000"
    volumes:
      - ../rag_app:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  bot_app:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    container_name: rag_bot
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - rag_app

  admin_webapp:
    build:
      context: ..
      dockerfile: docker/webapp.Dockerfile
    container_name: rag_webapp
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-3000}:80"
    depends_on:
      - rag_app

volumes:
  rag_pg_data:
  rag_redis_data:
  rag_minio_data:
