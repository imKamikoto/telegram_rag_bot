<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Assistant — Admin Mini App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #E8E6E1;
    min-height: 100vh;
    color: #18181B;
  }
  :root {
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  /* Light theme */
  .theme-light {
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F4F4F5;
    --fg: #18181B;
    --fg-2: #3F3F46;
    --muted: #71717A;
    --border: #E9E9EC;
    --border-strong: #D4D4D8;
    --accent: #6366F1;
    --accent-soft: rgba(99, 102, 241, 0.08);
  }
  /* Dark theme */
  .theme-dark {
    --bg: #17181B;
    --surface: #1E1F23;
    --surface-2: #27282E;
    --fg: #F4F4F5;
    --fg-2: #D4D4D8;
    --muted: #8A8A93;
    --border: #2A2B30;
    --border-strong: #3A3B40;
    --accent: #818CF8;
    --accent-soft: rgba(129, 140, 248, 0.14);
  }
  .density-compact { font-size: 13.5px; }
  .density-cozy { font-size: 14px; }
  .density-comfy { font-size: 15px; }

  /* Stage */
  .stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
    background:
      radial-gradient(circle at 20% 0%, rgba(99,102,241,0.08), transparent 60%),
      radial-gradient(circle at 90% 90%, rgba(217,119,87,0.05), transparent 60%),
      #E8E6E1;
  }
  .device {
    width: 390px; height: 844px;
    border-radius: 44px;
    background: var(--bg);
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 11px #1A1A1D,
      0 0 0 12px #2A2A2D,
      0 40px 80px rgba(0,0,0,0.20),
      0 12px 30px rgba(0,0,0,0.10);
    transition: background .2s;
  }
  .device-inner {
    height: 100%;
    display: flex; flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    position: relative;
  }
  .scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .scroll::-webkit-scrollbar { width: 0; }

  /* TG status bar (simulated) */
  .tg-status {
    height: 48px;
    padding: 12px 24px 0;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600;
    color: var(--fg);
    flex-shrink: 0;
    z-index: 5;
  }
  .tg-notch {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 32px; background: #000; border-radius: 18px; z-index: 6;
  }
  .tg-status-icons {
    display: flex; align-items: center; gap: 5px;
  }

  /* Bottom safe area */
  .home-indicator {
    height: 28px;
    position: relative;
    background: var(--bg);
  }
  .home-indicator::before {
    content: '';
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px;
    background: var(--fg);
    opacity: 0.85;
  }

  /* Stage label */
  .stage-label {
    position: absolute; top: 24px; left: 32px;
    font-family: var(--mono); font-size: 11px; color: #71717A;
    letter-spacing: 0.5px; text-transform: uppercase; font-weight: 500;
  }
  .stage-label b { color: #18181B; font-weight: 600; }

  button { font-family: inherit; }
  input { font-family: inherit; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="stage-label">RAG Assistant · <b>Admin Mini App</b> · 390 × 844</div>
  <div id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screens-1.jsx"></script>
<script type="text/babel" src="screens-2.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "accent": "#6366F1",
  "density": "compact",
  "listView": "cards"
}/*EDITMODE-END*/;

const SCREEN_TITLES = {
  ru: {
    home: 'RAG Assistant',
    kb: 'Базы знаний',
    'kb-detail': '',
    users: 'Пользователи',
    'user-detail': '',
    codes: 'Коды доступа',
    logs: 'Журнал активности',
    more: 'Ещё',
  },
  en: {
    home: 'RAG Assistant',
    kb: 'Knowledge bases',
    'kb-detail': '',
    users: 'Users',
    'user-detail': '',
    codes: 'Access codes',
    logs: 'Activity log',
    more: 'More',
  },
};

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [lang, setLang] = React.useState('ru');
  const [stack, setStack] = React.useState([{ screen: 'home', params: {} }]);
  const [modal, setModal] = React.useState(null);

  const cur = stack[stack.length - 1];
  const t = I18N[lang];

  const navigate = (screen, params = {}) => {
    // tab-level (replace stack root) for primary tabs
    const tabs = ['home', 'kb', 'users', 'codes', 'more'];
    if (tabs.includes(screen) && stack.length === 1 && tabs.includes(stack[0].screen)) {
      setStack([{ screen, params }]);
    } else if (tabs.includes(screen)) {
      setStack([{ screen, params }]);
    } else {
      setStack([...stack, { screen, params }]);
    }
  };
  const goBack = () => {
    if (stack.length > 1) setStack(stack.slice(0, -1));
  };
  const openModal = (kind, data) => setModal({ kind, data });
  const closeModal = () => setModal(null);

  // Sync accent to CSS var
  React.useEffect(() => {
    document.documentElement.style.setProperty('--accent', tweaks.accent);
    // derive soft accent
    const c = tweaks.accent;
    document.documentElement.style.setProperty('--accent-soft',
      `${c}1F`); // 12% alpha
  }, [tweaks.accent]);

  // Determine which top-level tab is active for the bottom bar
  const activeTab = (() => {
    const s = cur.screen;
    if (s === 'kb-detail') return 'kb';
    if (s === 'user-detail') return 'users';
    if (s === 'logs') return 'more';
    return s;
  })();

  // Header config per screen
  const isRoot = stack.length === 1;
  const screen = cur.screen;

  let headerProps = null;
  if (screen === 'home') {
    headerProps = null; // dashboard has its own greeting
  } else if (screen === 'kb-detail') {
    const kb = KBS.find(k => k.id === cur.params.id);
    headerProps = { title: kb?.name || '', onBack: goBack };
  } else if (screen === 'user-detail') {
    const u = USERS.find(x => x.id === cur.params.id);
    headerProps = { title: u?.name || '', onBack: goBack };
  } else {
    headerProps = {
      title: SCREEN_TITLES[lang][screen],
      onBack: !isRoot ? goBack : null,
      large: true,
    };
  }

  const themeClass = tweaks.theme === 'dark' ? 'theme-dark' : 'theme-light';
  const densityClass = `density-${tweaks.density}`;

  return (
    <>
      <div className={`device ${themeClass} ${densityClass}`}>
        <div className="tg-notch"></div>
        <div className="device-inner">
          <div className="tg-status">
            <span>9:41</span>
            <div className="tg-status-icons" style={{ color: 'var(--fg)' }}>
              <svg width="18" height="11" viewBox="0 0 18 11" fill="none">
                <rect x="0" y="7" width="3" height="4" rx="0.5" fill="currentColor"/>
                <rect x="5" y="5" width="3" height="6" rx="0.5" fill="currentColor"/>
                <rect x="10" y="2" width="3" height="9" rx="0.5" fill="currentColor"/>
                <rect x="15" y="0" width="3" height="11" rx="0.5" fill="currentColor" opacity="0.4"/>
              </svg>
              <svg width="16" height="11" viewBox="0 0 16 11" fill="none">
                <path d="M8 3a8 8 0 015.5 2L15 3.5A10 10 0 008 1a10 10 0 00-7 2.5L2.5 5A8 8 0 018 3z" fill="currentColor"/>
                <path d="M8 6a5 5 0 013.5 1.5L13 6a7 7 0 00-10 0L4.5 7.5A5 5 0 018 6z" fill="currentColor"/>
                <circle cx="8" cy="9" r="1.5" fill="currentColor"/>
              </svg>
              <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
                <rect x="0.5" y="0.5" width="22" height="11" rx="2.5" stroke="currentColor" strokeOpacity="0.5" fill="none"/>
                <rect x="2" y="2" width="19" height="8" rx="1.5" fill="currentColor"/>
                <path d="M23.5 4v4c.6-.2 1-.8 1-1.5v-1c0-.7-.4-1.3-1-1.5z" fill="currentColor" fillOpacity="0.4"/>
              </svg>
            </div>
          </div>

          {headerProps && (
            <Header {...headerProps} action={
              <button style={{
                width: 36, height: 36, borderRadius: 10, border: 0, background: 'transparent',
                color: 'var(--accent)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
              }}>
                <IconBox size={20}>{Icon.search}</IconBox>
              </button>
            } />
          )}

          <div className="scroll">
            {screen === 'home' && <ScreenHome t={t} lang={lang} navigate={navigate} density={tweaks.density} />}
            {screen === 'kb' && <ScreenKbList t={t} lang={lang} navigate={navigate} view={tweaks.listView} />}
            {screen === 'kb-detail' && <ScreenKbDetail t={t} lang={lang} navigate={navigate} params={cur.params} view={tweaks.listView} />}
            {screen === 'users' && <ScreenUsers t={t} lang={lang} navigate={navigate} view={tweaks.listView} />}
            {screen === 'user-detail' && <ScreenUserDetail t={t} lang={lang} navigate={navigate} params={cur.params} />}
            {screen === 'codes' && <ScreenCodes t={t} lang={lang} navigate={navigate} openModal={openModal} view={tweaks.listView} />}
            {screen === 'logs' && <ScreenLogs t={t} lang={lang} />}
            {screen === 'more' && <ScreenMore t={t} lang={lang} navigate={navigate} setLang={setLang} />}
          </div>

          {isRoot && <TabBar active={activeTab} onChange={navigate} t={t} />}
          <div className="home-indicator"></div>

          {modal?.kind === 'newCode' && <NewCodeSheet t={t} lang={lang} onClose={closeModal} />}
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakRadio label="Theme" value={tweaks.theme}
          options={['light', 'dark']}
          onChange={v => setTweak('theme', v)} />
        <TweakRadio label="Density" value={tweaks.density}
          options={[
            { value: 'compact', label: 'Compact' },
            { value: 'cozy', label: 'Cozy' },
            { value: 'comfy', label: 'Comfy' },
          ]}
          onChange={v => setTweak('density', v)} />
        <TweakColor label="Accent" value={tweaks.accent}
          onChange={v => setTweak('accent', v)} />
        <TweakSection label="Lists" />
        <TweakRadio label="View" value={tweaks.listView}
          options={[
            { value: 'rows', label: 'Rows' },
            { value: 'cards', label: 'Cards' },
          ]}
          onChange={v => setTweak('listView', v)} />
        <TweakSection label="Language" />
        <TweakRadio label="Locale" value={lang}
          options={[
            { value: 'ru', label: 'RU' },
            { value: 'en', label: 'EN' },
          ]}
          onChange={setLang} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
