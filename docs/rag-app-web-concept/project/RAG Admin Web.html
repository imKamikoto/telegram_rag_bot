<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Assistant — Web Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #f0eee9;
    min-height: 100vh;
    color: #18181B;
  }
  :root {
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  .theme-light {
    --bg: #FFFFFF;
    --surface: #FAFAFA;
    --surface-2: #F1F1F3;
    --fg: #18181B;
    --fg-2: #3F3F46;
    --muted: #71717A;
    --border: #E9E9EC;
    --border-strong: #D4D4D8;
    --accent: #6366F1;
    --accent-soft: rgba(99, 102, 241, 0.10);
    --row-hover: #FAFAFA;
  }
  .theme-dark {
    --bg: #17181B;
    --surface: #1E1F23;
    --surface-2: #27282E;
    --fg: #F4F4F5;
    --fg-2: #D4D4D8;
    --muted: #8A8A93;
    --border: #2A2B30;
    --border-strong: #3A3B40;
    --accent: #818CF8;
    --accent-soft: rgba(129, 140, 248, 0.16);
    --row-hover: #1B1C20;
  }

  .frame {
    background: var(--bg);
    color: var(--fg);
    width: 100%; height: 100%;
    overflow: hidden;
    display: flex; flex-direction: column;
    font-family: 'Inter', sans-serif;
  }
  .frame .scroll {
    flex: 1; overflow: auto;
    background: var(--bg);
  }
  .frame .scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .frame .scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .frame .scroll::-webkit-scrollbar-track { background: transparent; }

  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="web-primitives.jsx"></script>
<script type="text/babel" src="web-screens.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "#6366F1",
  "lang": "ru"
}/*EDITMODE-END*/;

// Wraps a screen with theme + top nav so each artboard renders a complete app shell.
function WebFrame({ tab, theme, accent, lang, children }) {
  React.useEffect(() => {
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-soft', accent + '1F');
  }, [accent]);
  const t = I18N[lang];
  return (
    <div className={'frame theme-' + theme} style={{ '--accent': accent, '--accent-soft': accent + '1F' }}>
      <WTopNav active={tab} t={t} lang={lang}/>
      <div className="scroll">{typeof children === 'function' ? children({ t, lang }) : children}</div>
    </div>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { theme, accent, lang } = tweaks;
  const t = I18N[lang];

  // Push a global accent var so child portals (focus overlay) inherit
  React.useEffect(() => {
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-soft', accent + '1F');
  }, [accent]);

  const W = 1680, H = 1050;

  return (
    <>
      <DesignCanvas>
        <DCSection id="overview" title="RAG Admin · Web" subtitle={lang === 'ru'
          ? 'Десктопная админ-панель. 1680 × 1050. Светлая/тёмная тема через Tweaks.'
          : 'Desktop admin panel. 1680 × 1050. Light/dark theme via Tweaks.'}>
          <DCArtboard id="dashboard" label={lang === 'ru' ? 'Дашборд' : 'Dashboard'} width={W} height={H}>
            <WebFrame tab="home" theme={theme} accent={accent} lang={lang}>
              <WDashboard t={t} lang={lang}/>
            </WebFrame>
          </DCArtboard>

          <DCArtboard id="kb-list" label={lang === 'ru' ? 'Базы знаний — список' : 'Knowledge bases — list'} width={W} height={H}>
            <WebFrame tab="kb" theme={theme} accent={accent} lang={lang}>
              <WKbList t={t} lang={lang}/>
            </WebFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="kb" title={lang === 'ru' ? 'Базы знаний — детали' : 'Knowledge base — details'}
          subtitle={lang === 'ru' ? 'Документы, доступы, загрузка' : 'Documents, access, upload'}>
          <DCArtboard id="kb-detail" label={lang === 'ru' ? 'БЗ · Документы' : 'KB · Documents'} width={W} height={H}>
            <WebFrame tab="kb" theme={theme} accent={accent} lang={lang}>
              <WKbDetail t={t} lang={lang}/>
            </WebFrame>
          </DCArtboard>

          <DCArtboard id="upload" label={lang === 'ru' ? 'Загрузка документов' : 'Upload documents'} width={W} height={H}>
            <WebFrame tab="kb" theme={theme} accent={accent} lang={lang}>
              <WDocUpload t={t} lang={lang}/>
            </WebFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="people" title={lang === 'ru' ? 'Пользователи и доступ' : 'Users & access'}
          subtitle={lang === 'ru' ? 'Управление пользователями и кодами доступа' : 'Manage users and access codes'}>
          <DCArtboard id="users" label={lang === 'ru' ? 'Пользователи' : 'Users'} width={W} height={H}>
            <WebFrame tab="users" theme={theme} accent={accent} lang={lang}>
              <WUsers t={t} lang={lang}/>
            </WebFrame>
          </DCArtboard>

          <DCArtboard id="codes" label={lang === 'ru' ? 'Коды доступа' : 'Access codes'} width={W} height={H}>
            <WebFrame tab="codes" theme={theme} accent={accent} lang={lang}>
              <WCodes t={t} lang={lang}/>
            </WebFrame>
          </DCArtboard>

          <DCArtboard id="code-gen" label={lang === 'ru' ? 'Генерация кода (модал)' : 'Generate code (modal)'} width={W} height={H}>
            <WebFrame tab="codes" theme={theme} accent={accent} lang={lang}>
              <div style={{ height: '100%', position: 'relative', background: 'var(--bg)' }}>
                <div style={{ opacity: 0.4, height: '100%', overflow: 'hidden' }}>
                  <WCodes t={t} lang={lang}/>
                </div>
                <div style={{ position: 'absolute', inset: 0 }}>
                  <WCodeGen t={t} lang={lang}/>
                </div>
              </div>
            </WebFrame>
          </DCArtboard>
        </DCSection>

        <DCSection id="ops" title={lang === 'ru' ? 'Операции' : 'Operations'}
          subtitle={lang === 'ru' ? 'Журнал, плейграунд, настройки' : 'Logs, playground, settings'}>
          <DCArtboard id="logs" label={lang === 'ru' ? 'Журнал активности' : 'Activity log'} width={W} height={H}>
            <WebFrame tab="logs" theme={theme} accent={accent} lang={lang}>
              <WLogs t={t} lang={lang}/>
            </WebFrame>
          </DCArtboard>

          <DCArtboard id="playground" label="RAG Playground" width={W} height={H}>
            <WebFrame tab="playground" theme={theme} accent={accent} lang={lang}>
              <WPlayground t={t} lang={lang}/>
            </WebFrame>
          </DCArtboard>

          <DCArtboard id="settings" label={lang === 'ru' ? 'Настройки' : 'Settings'} width={W} height={H}>
            <WebFrame tab="settings" theme={theme} accent={accent} lang={lang}>
              <WSettings t={t} lang={lang}/>
            </WebFrame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakRadio label="Theme" value={theme}
          options={['light', 'dark']}
          onChange={v => setTweak('theme', v)} />
        <TweakColor label="Accent" value={accent}
          onChange={v => setTweak('accent', v)} />
        <TweakSection label="Language" />
        <TweakRadio label="Locale" value={lang}
          options={[
            { value: 'ru', label: 'RU' },
            { value: 'en', label: 'EN' },
          ]}
          onChange={v => setTweak('lang', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
